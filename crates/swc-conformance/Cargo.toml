[package]
edition      = "2024"
name         = "swc-conformance"
rust-version = "1.99"
version      = "0.1.0"

[[bin]]
name = "swc-conformance"
path = "src/main.rs"
test = false

[dependencies]
clap                           = { version = "4.6.6", features = ["derive"] }
serde                          = { version = "1", features = ["derive"] }
serde_json                     = "1"
swc_experimental_allocator     = "0.11.0"
swc_experimental_ecma_ast      = "0.11.0"
swc_experimental_ecma_parser   = { version = "0.11.0", features = ["unstable"] }
swc_experimental_ecma_semantic = "0.11.0"
v8                             = "=152.2.0"

tsrs_ast         = { git = "https://github.com/oxc-project/tsrs", rev = "677622d08ef3c12f370b9342623a41d156687c0c" }
tsrs_compiler    = { git = "https://github.com/oxc-project/tsrs", rev = "677622d08ef3c12f370b9342623a41d156687c0c" }
tsrs_core        = { git = "https://github.com/oxc-project/tsrs", rev = "677622d08ef3c12f370b9342623a41d156687c0c" }
tsrs_diagnostics = { git = "https://github.com/oxc-project/tsrs", rev = "677622d08ef3c12f370b9342623a41d156687c0c" }
tsrs_testrunner  = { git = "https://github.com/oxc-project/tsrs", rev = "677622d08ef3c12f370b9342623a41d156687c0c" }
tsrs_tsoptions   = { git = "https://github.com/oxc-project/tsrs", rev = "677622d08ef3c12f370b9342623a41d156687c0c" }
tsrs_vfs         = { git = "https://github.com/oxc-project/tsrs", rev = "677622d08ef3c12f370b9342623a41d156687c0c" }
